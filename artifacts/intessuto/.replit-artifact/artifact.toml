kind = "web"
previewPath = "/"
title = "Intessuto Performance Suite"
version = "1.0.0"
id = "artifacts/intessuto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20322

[services.development]
run = "pnpm --filter @workspace/intessuto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/intessuto", "run", "build" ]
publicDir = "artifacts/intessuto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20322"
BASE_PATH = "/"
