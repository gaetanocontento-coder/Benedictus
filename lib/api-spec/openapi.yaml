openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Intessuto Performance Suite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard statistics
  - name: leads
    description: Lead management
  - name: clienti
    description: Customer management
  - name: materiali
    description: Material catalog
  - name: campioni
    description: Sample requests
  - name: proposte
    description: Commercial proposals
  - name: insights
    description: Business insights
  - name: b-auth
    description: Benedictus authentication
  - name: b-newsletter
    description: Newsletter subscriptions
  - name: b-lectio
    description: Lectio Humanitatis content
  - name: b-episodes
    description: Abbas podcast episodes
  - name: b-workshops
    description: Officina della Sapienza workshops
  - name: b-testimonials
    description: Community testimonials
  - name: b-graduates
    description: Voto del Custode graduates
  - name: b-plans
    description: Membership plans
  - name: b-checkout
    description: Stripe checkout and billing
  - name: b-stats
    description: Community statistics
  - name: b-admin
    description: Admin panel operations
  - name: b-percorso
    description: Percorso del Custode — module progress tracking
  - name: b-liturgia
    description: Liturgia del Giorno, Lectio Divina e Esercizi Ignaziani

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Demo login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard KPI stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/andamento:
    get:
      operationId: getDashboardAndamento
      tags: [dashboard]
      summary: Get monthly trend data for chart
      responses:
        "200":
          description: Monthly trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AndamentoMensile"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: stato
          in: query
          schema:
            type: string
        - name: fonte
          in: query
          schema:
            type: string
        - name: interesse
          in: query
          schema:
            type: string
        - name: commerciale
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/stats/per-stato:
    get:
      operationId: getLeadsPerStato
      tags: [leads]
      summary: Get lead counts grouped by stato
      responses:
        "200":
          description: Leads per stato
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadStatoCount"

  /clienti:
    get:
      operationId: listClienti
      tags: [clienti]
      summary: List all customers
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      operationId: createCliente
      tags: [clienti]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clienti/{id}:
    get:
      operationId: getCliente
      tags: [clienti]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404":
          description: Not found
    patch:
      operationId: updateCliente
      tags: [clienti]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /materiali:
    get:
      operationId: listMateriali
      tags: [materiali]
      summary: List all materials
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
        - name: disponibile
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Materiale"
    post:
      operationId: createMateriale
      tags: [materiali]
      summary: Create a material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Materiale"

  /materiali/{id}:
    get:
      operationId: getMateriale
      tags: [materiali]
      summary: Get a material by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Materiale"
        "404":
          description: Not found
    patch:
      operationId: updateMateriale
      tags: [materiali]
      summary: Update a material
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Materiale"

  /materiali/stats/top-richiesti:
    get:
      operationId: getTopMateriali
      tags: [materiali]
      summary: Get most requested materials
      responses:
        "200":
          description: Top requested materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialeRichiesto"

  /campioni:
    get:
      operationId: listCampioni
      tags: [campioni]
      summary: List all sample requests
      parameters:
        - name: stato
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of sample requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RichiestaCampione"
    post:
      operationId: createCampione
      tags: [campioni]
      summary: Create a sample request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RichiestaCampioneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RichiestaCampione"

  /campioni/{id}:
    patch:
      operationId: updateCampione
      tags: [campioni]
      summary: Update a sample request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RichiestaCampioneUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RichiestaCampione"

  /proposte:
    get:
      operationId: listProposte
      tags: [proposte]
      summary: List all proposals
      responses:
        "200":
          description: List of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposta"
    post:
      operationId: createProposta
      tags: [proposte]
      summary: Create a proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropostaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposta"

  /proposte/{id}:
    get:
      operationId: getProposta
      tags: [proposte]
      summary: Get a proposal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposta"
        "404":
          description: Not found
    patch:
      operationId: updateProposta
      tags: [proposte]
      summary: Update a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropostaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposta"

  /insights:
    get:
      operationId: getInsights
      tags: [insights]
      summary: Get business insights and suggestions
      responses:
        "200":
          description: Business insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insights"

  /b/auth/register:
    post:
      operationId: bRegister
      tags: [b-auth]
      summary: Register a new Benedictus user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BRegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BAuthUser"
        "409":
          description: Email already in use

  /b/auth/login:
    post:
      operationId: bLogin
      tags: [b-auth]
      summary: Login to Benedictus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BAuthUser"
        "401":
          description: Invalid credentials

  /b/auth/me:
    get:
      operationId: bGetMe
      tags: [b-auth]
      summary: Get current Benedictus user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BAuthUser"
        "401":
          description: Not authenticated

  /b/auth/logout:
    post:
      operationId: bLogout
      tags: [b-auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /b/newsletter:
    post:
      operationId: bSubscribeNewsletter
      tags: [b-newsletter]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BNewsletterInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /b/lectio:
    get:
      operationId: bListLectio
      tags: [b-lectio]
      summary: List Lectio Humanitatis articles
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BLectio"

  /b/lectio/recenti:
    get:
      operationId: bGetLectioRecenti
      tags: [b-lectio]
      summary: Get 3 most recent free articles
      responses:
        "200":
          description: Recent free articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BLectio"

  /b/lectio/{id}:
    get:
      operationId: bGetLectio
      tags: [b-lectio]
      summary: Get a single Lectio article (gated by tier)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BLectio"
        "403":
          description: Insufficient membership tier
        "404":
          description: Not found

  /b/episodes:
    get:
      operationId: bListEpisodes
      tags: [b-episodes]
      summary: List Abbas podcast episodes
      responses:
        "200":
          description: List of episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BEpisode"

  /b/episodes/featured:
    get:
      operationId: bGetFeaturedEpisode
      tags: [b-episodes]
      summary: Get the latest featured episode
      responses:
        "200":
          description: Featured episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BEpisode"

  /b/episodes/{id}:
    get:
      operationId: bGetEpisode
      tags: [b-episodes]
      summary: Get a single episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Episode found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BEpisode"
        "404":
          description: Not found

  /b/workshops:
    get:
      operationId: bListWorkshops
      tags: [b-workshops]
      summary: List upcoming workshops
      responses:
        "200":
          description: List of workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BWorkshop"

  /b/workshops/{id}/iscrivi:
    post:
      operationId: bRegisterWorkshop
      tags: [b-workshops]
      summary: Register for a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /b/testimonials:
    get:
      operationId: bListTestimonials
      tags: [b-testimonials]
      summary: List community testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BTestimonial"

  /b/graduates:
    get:
      operationId: bListGraduates
      tags: [b-graduates]
      summary: List Voto del Custode graduates
      responses:
        "200":
          description: List of graduates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BGraduate"

  /b/plans:
    get:
      operationId: bListPlans
      tags: [b-plans]
      summary: List membership plans with prices
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BPlan"

  /b/checkout:
    post:
      operationId: bCreateCheckout
      tags: [b-checkout]
      summary: Create Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BCheckoutInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required: [url]

  /b/checkout/portal:
    post:
      operationId: bCreatePortal
      tags: [b-checkout]
      summary: Create Stripe billing portal session
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required: [url]

  /b/subscription:
    get:
      operationId: bGetSubscription
      tags: [b-checkout]
      summary: Get current user subscription
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BSubscription"

  /b/stats:
    get:
      operationId: bGetStats
      tags: [b-stats]
      summary: Get community statistics
      responses:
        "200":
          description: Community statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BCommunityStats"

  /b/admin/subscribers:
    get:
      operationId: bListSubscribers
      tags: [b-admin]
      summary: List newsletter subscribers (admin)
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BNewsletterSubscriber"

  /b/admin/lectio:
    post:
      operationId: bCreateLectio
      tags: [b-admin]
      summary: Create a new Lectio article (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BLectioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BLectio"

  /b/admin/lectio/{id}:
    patch:
      operationId: bUpdateLectio
      tags: [b-admin]
      summary: Update a Lectio article (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BLectioUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BLectio"
    delete:
      operationId: bDeleteLectio
      tags: [b-admin]
      summary: Delete a Lectio article (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /b/admin/episodes:
    post:
      operationId: bCreateEpisode
      tags: [b-admin]
      summary: Create a new podcast episode (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BEpisodeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BEpisode"

  /b/admin/testimonials:
    post:
      operationId: bCreateTestimonial
      tags: [b-admin]
      summary: Create a testimonial (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BTestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BTestimonial"

  /b/admin/testimonials/{id}:
    delete:
      operationId: bDeleteTestimonial
      tags: [b-admin]
      summary: Delete a testimonial (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /b/percorso/progress:
    get:
      operationId: bGetPercorsoProgress
      tags: [b-percorso]
      summary: Get user's module progress for all 6 modules
      responses:
        "200":
          description: Array of module progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BModuleProgress"
        "401":
          description: Unauthorized

  /b/percorso/modules/{id}/inizia:
    post:
      operationId: bStartModule
      tags: [b-percorso]
      summary: Mark a module as started
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 6
      responses:
        "200":
          description: Module started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "401":
          description: Unauthorized

  /b/percorso/modules/{id}/completa:
    post:
      operationId: bCompleteModule
      tags: [b-percorso]
      summary: Mark a module as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 6
      responses:
        "200":
          description: Module completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "401":
          description: Unauthorized

  # ── Oblato gamification ──────────────────────────────────────────────────

  /b/oblato/profilo:
    get:
      operationId: bGetOblatoProfilo
      tags: [b-oblato]
      summary: Get current user's oblato profile
      responses:
        "200":
          description: Oblato profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOblatoProfilo"
        "401":
          description: Unauthorized

  /b/officium/check-in:
    post:
      operationId: bOfficiumCheckIn
      tags: [b-oblato]
      summary: Check in at current canonical hour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficiumCheckInInput"
      responses:
        "200":
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficiumCheckInResult"
        "409":
          description: Already checked in for this hour today
        "401":
          description: Unauthorized

  /b/officium/oggi:
    get:
      operationId: bGetOfficiumOggi
      tags: [b-oblato]
      summary: Get today's check-ins for current user
      responses:
        "200":
          description: List of today's check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BOfficiumCheckIn"
        "401":
          description: Unauthorized

  /b/sigilli:
    get:
      operationId: bGetSigilli
      tags: [b-oblato]
      summary: Get current user's earned sigilli (achievements)
      responses:
        "200":
          description: List of earned sigilli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BSigillo"
        "401":
          description: Unauthorized

  /b/capitolo/corrente:
    get:
      operationId: bGetCapitoloCorrente
      tags: [b-oblato]
      summary: Get this week's chapter of the Rule
      responses:
        "200":
          description: Current week's chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BCapitolo"
        "401":
          description: Unauthorized

  /b/libro-cuore:
    get:
      operationId: bGetLibroCuore
      tags: [b-oblato]
      summary: Get user's journal entries
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BLibroCuoreEntry"
        "401":
          description: Unauthorized
    post:
      operationId: bSalvaLibroCuore
      tags: [b-oblato]
      summary: Save a journal entry (capitolo reflection or esame di coscienza)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BLibroCuoreInput"
      responses:
        "201":
          description: Entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BLibroCuoreEntry"
        "401":
          description: Unauthorized

  /b/esame/domande:
    get:
      operationId: bGetEsameDomande
      tags: [b-oblato]
      summary: Get today's esame di coscienza questions
      responses:
        "200":
          description: Three questions for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BEsameDomande"
        "401":
          description: Unauthorized

  /b/liturgia:
    get:
      operationId: bGetLiturgiaGiorno
      tags: [b-liturgia]
      summary: Get liturgical readings for a given date (default today)
      parameters:
        - name: data
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Liturgical readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BLiturgiaGiorno"
        "503":
          description: External readings source unavailable

  /b/pratiche:
    get:
      operationId: bListPratiche
      tags: [b-liturgia]
      summary: List user's spiritual practice journal entries (last 30)
      responses:
        "200":
          description: List of practices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BPraticaSpirituale"
        "401":
          description: Unauthorized
    post:
      operationId: bSavePratica
      tags: [b-liturgia]
      summary: Save (upsert) a spiritual practice entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPraticaInput"
      responses:
        "200":
          description: Saved practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPraticaSpirituale"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /b/pratiche/{data}:
    get:
      operationId: bGetPraticheByDate
      tags: [b-liturgia]
      summary: Get user's practices for a specific date
      parameters:
        - name: data
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Practices for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BPraticaSpirituale"
        "401":
          description: Unauthorized

  /b/guida-spirituale:
    post:
      operationId: bGuidaSpirituale
      tags: [b-liturgia]
      summary: Stream AI spiritual guidance for Lectio Divina or Ignatian Exercises (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BGuidaSpirituale"
      responses:
        "200":
          description: SSE stream of spiritual guidance text
        "400":
          description: Bad request

