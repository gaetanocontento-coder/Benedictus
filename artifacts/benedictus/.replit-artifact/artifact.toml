kind = "web"
previewPath = "/benedictus/"
title = "Benedictus — Regula Humanitatis"
version = "1.0.0"
id = "artifacts/benedictus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/benedictus/" ]
localPort = 22271

[services.development]
run = "pnpm --filter @workspace/benedictus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/benedictus", "run", "build" ]
publicDir = "artifacts/benedictus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22271"
BASE_PATH = "/benedictus/"
